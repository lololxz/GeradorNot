name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nome do Aplicativo no Celular (ex: Nubank, WhatsApp, Calculadora, Notificações)'
        required: false
        default: 'Gerador de Notificações'
      apk_name:
        description: 'Nome do arquivo .apk final (sem .apk)'
        required: false
        default: 'GeradorNotificacoes'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set Custom App Name (if provided)
      if: "${{ github.event.inputs.app_name != '' }}"
      run: |
        sed -i 's|<string name="app_name">.*</string>|<string name="app_name">${{ github.event.inputs.app_name }}</string>|g' app/src/main/res/values/strings.xml
        echo "Nome do app alterado para: ${{ github.event.inputs.app_name }}"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Prepare APK Output
      run: |
        APK_FILENAME="${{ github.event.inputs.apk_name || 'GeradorNotificacoes' }}.apk"
        cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${APK_FILENAME}"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GeradorNotificacoes-APK
        path: app/build/outputs/apk/debug/*.apk
